{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    
    <!-- Dark mode toggle button -->
    <button class="theme-toggle" data-theme-toggle title="Toggle dark mode" aria-label="Toggle dark mode">
      <span class="theme-icon">🌙</span>
    </button>

    {% include masthead.html %}

    <!-- Main content with animation -->
    <div class="page__wrapper" data-animate="fade-in-up">
      {{ content }}
    </div>

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}
    
    <!-- Load theme manager -->
    <script src="{{ base_path }}/assets/js/theme-manager.js"></script>
    
    <!-- Load animations -->
    <script src="{{ base_path }}/assets/js/scroll-reveal.js"></script>
    <script src="{{ base_path }}/assets/js/background-animation.js"></script>

  </body>
</html>
