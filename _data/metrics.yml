# Metrics shown on the homepage and /publications/.
#
# Counts below are derived from what is actually in this repository, so they
# stay true as you add content. Update them when you add a paper or a talk.
#
# scholar_* are BLANK on purpose. Google Scholar has no public API, so nothing
# here can verify them and no number is invented for you. Fill them in from
# your Scholar profile and the tiles appear; leave them blank and the tiles are
# omitted rather than showing a placeholder. assets/js/metrics.js will also try
# to refresh them at runtime and silently keeps these values if it cannot.

# --- From your Google Scholar profile: https://scholar.google.com/citations?user=Zjv26VEAAAAJ
scholar_citations:        # e.g. 87
scholar_hindex:           # e.g. 5
scholar_i10:              # e.g. 3
scholar_updated:          # e.g. "September 2026"

# --- Derived from repository content
publications_total: 9
conference_papers: 6
journal_articles: 1
book_chapters: 1
preprints: 1
invited_talks: 7
students_mentored: 5
best_paper_awards: 1
pc_memberships: 6

# --- Tiles rendered on the homepage, in order.
# `key` reads from the values above; `value` hardcodes a string instead.
# A tile whose `key` resolves to blank is skipped automatically.
tiles:
  - key: publications_total
    label: "Publications"
  - key: scholar_citations
    label: "Citations"
    note: "Google Scholar"
  - key: scholar_hindex
    label: "h-index"
    note: "Google Scholar"
  - value: "1"
    label: "Best Paper"
    note: "HOST 2024"
    accent: true
  - key: students_mentored
    label: "Students Mentored"
  - key: invited_talks
    label: "Talks Given"
