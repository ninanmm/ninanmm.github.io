{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<!-- Theme initialization - placed early to prevent flash -->
<script>
  (function() {
    const STORAGE_KEY = 'theme-preference';
    const THEME_ATTR = 'data-theme';
    
    function getStoredTheme() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored && ['light', 'dark'].includes(stored) ? stored : null;
      } catch (e) {
        return null;
      }
    }
    
    function getSystemTheme() {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        return 'dark';
      }
      return 'light';
    }
    
    const theme = getStoredTheme() || getSystemTheme();
    document.documentElement.setAttribute(THEME_ATTR, theme);
  })();
</script>

<meta http-equiv="cleartype" content="on">
